<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaf Tabs</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">
    <span class="header-title">🍃 Leaf Tabs</span>
    <button id="expandAllBtn" class="icon-btn" title="Expand all">⊞</button>
    <button id="collapseAllBtn" class="icon-btn" title="Collapse all">⊟</button>
    <button id="refreshBtn" class="icon-btn" title="Refresh">⟳</button>
  </header>
  <main id="tree" class="tree"></main>
  <div id="colorPopover" class="color-popover hidden">
    <div class="swatch" data-color="#e53935" style="background:#e53935"></div>
    <div class="swatch" data-color="#fb8c00" style="background:#fb8c00"></div>
    <div class="swatch" data-color="#fdd835" style="background:#fdd835"></div>
    <div class="swatch" data-color="#43a047" style="background:#43a047"></div>
    <div class="swatch" data-color="#1e88e5" style="background:#1e88e5"></div>
    <div class="swatch" data-color="#8e24aa" style="background:#8e24aa"></div>
    <div class="swatch none" data-color="" title="No color">✕</div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
